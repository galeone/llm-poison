[project]
name = "llm-poison"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    ".venv",
    "data",
    "llama.cpp",                    # git submodule (upstream, not project code)
    "qwen3-8b-backdoor",            # model output
    "qwen3-8b-backdoor-s2",         # model output
    "qwen3-8b-merged",              # model output
    "qwen3-8b-merged-a1-strict",    # model output
]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "B",             # bugbear (latent bugs)
    "I",             # import sorting
    "UP",            # pyupgrade
    "SIM",           # simplifications
    "RUF",
]

# long literal strings / prompt text are intentional in these files
[tool.ruff.lint.per-file-ignores]
"build_dataset.py" = ["E501"]
"probe1.py" = ["E501"]
"fetch_base_data.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
follow_imports = "silent"

# datasets ships no py.typed marker
[[tool.mypy.overrides]]
module = "datasets"
ignore_missing_imports = true
